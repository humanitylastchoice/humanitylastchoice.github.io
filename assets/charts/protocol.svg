nt-size="15" fill="#1D1713" text-anchor="start" style="font-family:'Newsreader','Iowan Old Style',serif;" font-weight="400">ranks for the person</text><line x1="500.0" y1="95.0" x2="600.0" y2="175.0" stroke="#867F77" stroke-width="1"/><line x1="500.0" y1="185.0" x2="600.0" y2="175.0" stroke="#867F77" stroke-width="1"/><line x1="500.0" y1="275.0" x2="600.0" y2="175.0" stroke="#867F77" stroke-width="1"/><rect x="880" y="60" width="220" height="90" rx="4" fill="#F8F5F0" stroke="#1D1713" stroke-width="1.25"/><text x="894.0" y="84.0" font-size="11.5" fill="#867F77" text-anchor="start" style="font-family:'IBM Plex Mono','SF Mono',Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;font-weight:500;" font-weight="400">Clean run</text><text x="894.0" y="106.0" font-size="15" fill="#1D1713" text-anchor="start" style="font-family:'Newsreader','Iowan Old Style',serif;" font-weight="400">ranking 1</text><rect x="880" y="240" width="220" height="90" rx="4" fill="#F8F5F0" stroke="#A83630" stroke-width="1.25" stroke-dasharray="4 3"/><text x="894.0" y="264.0" font-size="11.5" fill="#A83630" text-anchor="start" style="font-family:'IBM Plex Mono','SF Mono',Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;font-weight:500;" font-weight="400">Shaped run</text><text x="894.0" y="286.0" font-size="15" fill="#1D1713" text-anchor="start" style="font-family:'Newsreader','Iowan Old Style',serif;" font-weight="400">ranking 2</text><line x1="800.0" y1="160.0" x2="880.0" y2="105.0" stroke="#867F77" stroke-width="1"/><line x1="800.0" y1="190.0" x2="880.0" y2="285.0" stroke="#A83630" stroke-width="1"/><text x="990.0" y="200.0" font-size="13" fill="#1D1713" text-anchor="middle" style="font-family:'Newsreader','Iowan Old Style',serif;font-style:italic;" font-weight="400">the gap is the score</text></svg>
